version: '3.9'

services:
  # ─── MongoDB ─────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: leadpilot-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: leadpilot
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - leadpilot-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: leadpilot-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/leadpilot
      PORT: 4000
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CORS_ORIGIN: http://localhost:3000
      DISCOVERY_CRON: ${DISCOVERY_CRON:-0 6 * * *}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4000:4000"
    networks:
      - leadpilot-network
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix

  # ─── Web ─────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: leadpilot-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    networks:
      - leadpilot-network

volumes:
  mongodb_data:
    driver: local

networks:
  leadpilot-network:
    driver: bridge
